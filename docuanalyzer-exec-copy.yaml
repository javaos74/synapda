apiVersion: v1
kind: Pod
metadata:
  name: file-uploader-pod
spec:
  # --- 컨테이너 정의 ---
  containers:
    - name: uploader-container
      # 어떤 이미지든 상관없지만, 가장 가볍고 흔한 이미지 중 하나인 alpine을 사용합니다.
      image: alpine:latest
      # 컨테이너가 바로 종료되지 않고 계속 실행되도록 하는 명령입니다.
      # 여기서는 1시간(3600초) 동안 대기하도록 설정합니다.
      command: ["/bin/sh", "-c", "sleep 3600"]
      # --- 볼륨 마운트 정의 ---
      volumeMounts:
        - name: persistent-storage  # 아래 volumes에서 정의한 볼륨 이름
          mountPath: /storage      # 컨테이너 내부에서 PV가 연결될 경로. /storage, /data 등 원하는 이름으로 설정 가능합니다.

  # --- 볼륨(PVC) 정의 ---
  volumes:
    - name: persistent-storage # 위 volumeMounts의 이름과 일치해야 합니다.
      persistentVolumeClaim:
        # !!! 가장 중요한 부분 !!!
        # 여기에 파일을 올리고자 하는 PVC의 실제 이름을 입력해주세요.
        claimName: synap-da-exe-pvc
